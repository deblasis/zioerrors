name: CI

on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: extractions/setup-just@v3
      - name: just ci
        run: just ci
